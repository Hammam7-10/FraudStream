name: bank-fraud-streaming

x-app-environment: &app-environment
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  APP_DB_PATH: /app/data/fraud.db
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: bank-transactions
  HDFS_RAW_PATH: hdfs://itvdelab:9000/fraud/raw-transactions
  HDFS_CHECKPOINT_PATH: hdfs://itvdelab:9000/fraud/checkpoints/stream

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 20"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.3.2
    command: >
      bash -c "kafka-topics --bootstrap-server kafka:29092
      --create --if-not-exists --topic bank-transactions
      --partitions 3 --replication-factor 1"
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bank-fraud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy

  storage-init:
    image: bank-fraud-runtime:latest
    user: root
    command: bash -c "mkdir -p /app/data && chown -R itversity:itversity /app/data"
    volumes:
      - app_data:/app/data

  cluster_util_db:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: itversity
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-hive.sql:ro
      - hive_metastore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  itvdelab:
    image: itversity/itvdelab:latest
    hostname: itvdelab
    ports:
      - "9870:9870"
      - "8088:8088"
    environment:
      SHELL: /bin/bash
    volumes:
      - hadoop_opt:/opt
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      cluster_util_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  spark-stream:
    image: bank-fraud-runtime:latest
    build:
      context: .
      dockerfile: Dockerfile.spark
    command:
      - /opt/spark/bin/spark-submit
      - /app/src/fraud_streaming_job.py
    environment: *app-environment
    volumes:
      - ./:/app
      - app_data:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      itvdelab:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: bank-fraud-runtime:latest
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *app-environment
    volumes:
      - ./:/app
      - app_data:/app/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

volumes:
  app_data:
  hadoop_opt:
  hive_metastore:
